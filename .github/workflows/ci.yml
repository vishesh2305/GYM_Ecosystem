name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - name: Migrations match schema
        run: |
          pnpm --filter @gym/db exec drizzle-kit check
          pnpm --filter @gym/db exec drizzle-kit generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain packages/db/migrations)"
      - run: pnpm build
      - name: OpenAPI document matches contracts
        run: |
          pnpm --filter @gym/api openapi
          git diff --exit-code -- apps/api/openapi.json
      - run: pnpm audit --audit-level high

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image and check it migrates, starts and is ready
        run: apps/api/scripts/smoke-image.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9
      - run: terraform fmt -recursive -check infra/terraform
      - name: Validate every root (no cloud credentials needed)
        run: |
          for root in infra/terraform/bootstrap infra/terraform/envs/*; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Lint
        run: >
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf ghcr.io/terraform-linters/tflint:v0.65.0
          --config /tf/.tflint.hcl --recursive
      - name: Security misconfigurations (high and critical)
        run: >
          docker run --rm -v "$PWD/infra/terraform:/tf" aquasec/trivy:0.75.0
          config --quiet --severity HIGH,CRITICAL --exit-code 1 /tf

  api-breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on breaking changes to /v1
        run: |
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "$base:apps/api/openapi.json" 2>/dev/null; then
            mkdir -p /tmp/base
            git show "$base:apps/api/openapi.json" > /tmp/base/openapi.json
            docker run --rm -v /tmp/base:/base -v "$PWD/apps/api:/head" tufin/oasdiff \
              breaking /base/openapi.json /head/openapi.json --fail-on ERR
          else
            echo "No openapi.json on base branch yet; skipping."
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/secrets --error
