# Local development only. Ports bind to 127.0.0.1; credentials are throwaway dev values.
name: gym-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym
    ports: ["127.0.0.1:54320:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:63790:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional local monitoring (docker compose --profile observability up -d): send the API's metrics with
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, then open Grafana at http://localhost:3300.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.0
    volumes: ["./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana-provisioning.yaml:/etc/grafana/provisioning/datasources/gym.yaml:ro
      - ./infra/observability/grafana-provisioning.yaml:/etc/grafana/provisioning/dashboards/gym.yaml:ro
      - ./infra/observability/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3300:3000"]

volumes:
  pgdata:
